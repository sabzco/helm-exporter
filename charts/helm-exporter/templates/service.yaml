apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "helm-exporter.labels" . | nindent 4 }}
spec:
  selector: {{- include "helm-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 9571
      targetPort: http
{{- if .Values.serviceMonitor.create }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "helm-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-exporter.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "helm-exporter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
